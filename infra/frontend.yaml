AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - frontend on a private S3 bucket behind CloudFront (pay-as-you-go pricing,
  no flat-rate plan). The app calls the backend's Lambda function URL directly. A custom
  domain can be attached later with `make add-domain`.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >-
      Edge locations to serve from. PriceClass_100 (North America and Europe) is the cheapest;
      pay-as-you-go also includes 1 TB and 10M requests per month free.
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain, e.g. app.example.com (set by `make add-domain`).
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate in us-east-1 covering DomainName (set by `make add-domain`).
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Optional Route 53 hosted zone of DomainName. If set, the alias records are created here;
      otherwise point the domain at the distribution yourself.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  HasHostedZone: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Origin access controls, bucket policies and DNS records have no tags.
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this distribution may read the bucket.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${ProjectName} frontend
        Enabled: true
        DefaultRootObject: index.html
        # Client-side routes (/home, /login, /signup) are not files in the bucket: S3 answers
        # 403 for them, so serve index.html and let the router take over.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: frontend
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Z2FDTNDATAQYW2 is the fixed hosted zone of every CloudFront distribution.
  DomainRecordIPv4:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DomainRecordIPv6:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Description: Target for a CNAME record when the custom domain's DNS is not in Route 53
    Value: !GetAtt Distribution.DomainName
  AppUrl:
    Value: !Sub https://${Distribution.DomainName}
  CustomDomainUrl:
    Condition: HasDomain
    Value: !Sub https://${DomainName}
