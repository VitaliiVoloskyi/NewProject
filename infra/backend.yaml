AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - backend API as a container on ECS Fargate behind an Application Load
  Balancer, with its PostgreSQL database on RDS. Tasks run in public subnets with a public IP
  (so they can pull from ECR and reach Cognito without a NAT gateway), but their security
  group only accepts traffic from the load balancer. The database sits in private subnets and
  only accepts connections from the tasks.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: Full backend image URI including the commit-SHA tag (pushed by make deploy-backend).
  CorsOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Comma-separated origins allowed to call the API (kept up to date by the scripts).
  CognitoUserPoolId:
    Type: String
    Description: User pool whose ID tokens the API accepts (output of the auth stack).
  CognitoClientId:
    Type: String
    Description: App client the tokens must be issued to (output of the auth stack).
  ApiDomain:
    Type: String
    Default: ""
    Description: Optional API host name, e.g. api.example.com (API_DOMAIN in .env).
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for ApiDomain in this region. Enables the HTTPS listener.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 zone of ApiDomain; if set, the alias record is created here.
  DesiredCount:
    Type: Number
    Default: 1
    Description: Number of running backend containers.
  TaskCpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
  TaskMemory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: db.t4g.micro is free-tier eligible (750 hours/month for 12 months on older accounts).
  DBName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  DBUser:
    Type: String
    Default: meetings
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasDnsRecord: !And
    - !Condition HasCertificate
    - !Not [!Equals [!Ref ApiDomain, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref ProjectName
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Two availability zones: an ALB and an RDS subnet group both require two.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-a
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-b
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private: no route to the internet at all (the VPC's main route table is local-only).
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --------------------------------------------------------- Security groups
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer, open to the internet on 80 and 443
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend containers, reachable only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the backend containers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ---------------------------------------------------------------- Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the backend database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      # cfn-lint only knows full versions; RDS accepts a major version and picks its default minor.
      cfn-lint:
        config:
          ignore_checks: [W3691]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-db
      Engine: postgres
      # Major version only: RDS picks the current default minor and patches it.
      EngineVersion: "17"
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUser
      # SecureString created by infra/deploy-backend.sh (CloudFormation cannot create one).
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/${ProjectName}/db-password}}"
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      EnablePerformanceInsights: false
      CopyTagsToSnapshot: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # ----------------------------------------------------------- Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-alb
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # The health check: every 15 s the ALB calls /api/health on each container (which also
  # runs SELECT 1 against the database). 3 failures in a row mark the container unhealthy:
  # it stops getting traffic and ECS replaces it.
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-api
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # Old containers get 30 s to finish in-flight requests during a deployment.
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Port 80: forwards to the API until there is a certificate, then only redirects to HTTPS.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ECS refuses a target group that no listener uses yet. This handle depends on whichever
  # listener forwards to it (a DependsOn cannot name a conditional resource directly).
  ListenersReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Http: !Ref HttpListener
      Https: !If [HasCertificate, !Ref HttpsListener, ""]

  # api.<domain> -> load balancer, when the domain's DNS is in Route 53.
  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # --------------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/backend
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Used by ECS itself (not by the app) to pull the image, write logs and read the secret.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-password
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/db-password
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: !Ref DBUser
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPoolId
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId
          # Injected by ECS at start from Parameter Store; never stored in the task definition.
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/db-password
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenersReady
    Properties:
      ServiceName: backend
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      # Migrations run at container start; give them time before health checks count.
      HealthCheckGracePeriodSeconds: 60
      # Rolling update: start the new container, wait until it is healthy, then stop the old
      # one. If the new one never gets healthy, roll back to the previous task definition.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      PropagateTags: SERVICE
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ApiBaseUrl:
    Description: Origin the frontend is built against (https://<ApiDomain> once it has a certificate)
    Value: !If
      - HasCertificate
      - !Sub https://${ApiDomain}
      - !Sub http://${LoadBalancer.DNSName}
  LoadBalancerDns:
    Description: Target for the api CNAME record when the DNS is not in Route 53
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref LogGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
