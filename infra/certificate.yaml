AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - TLS certificate for one custom domain, validated by DNS. Used twice: for
  app.<domain> in us-east-1 (the only region CloudFront accepts) and for api.<domain> in the
  load balancer's region.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  DomainName:
    Type: String
    Description: Custom domain, e.g. app.example.com or api.example.com
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Optional Route 53 hosted zone of DomainName. If set, CloudFormation adds the DNS
      validation record itself; otherwise add the record the deploy script prints.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  CertificateArn:
    Value: !Ref Certificate
