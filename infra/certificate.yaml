AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - TLS certificate for the custom frontend domain. CloudFront only accepts
  ACM certificates from us-east-1, so `make add-domain` deploys this stack there.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  DomainName:
    Type: String
    Description: Custom domain, e.g. app.example.com
  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Optional Route 53 hosted zone of DomainName. If set, CloudFormation adds the DNS
      validation record itself; otherwise add the record printed by `make add-domain`.

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  CertificateArn:
    Value: !Ref Certificate
