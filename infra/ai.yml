AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - Paste an agenda. The agenda-parser Lambda, outside the VPC, behind a public
  function URL: it checks the caller's Cognito token, sends the pasted text to Claude on Amazon
  Bedrock and returns a suggested agenda as JSON. It has no database access and writes
  nothing; the browser saves the agenda through the API. Plus a monthly budget alarm.
  Deployed by `make deploy-ai` after `make deploy-backend` and `make deploy-auth`.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  ImageUri:
    Type: String
    Description: >-
      The backend image built at its `app` target (no Lambda Web Adapter); pushed by the
      deploy script.
  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: >-
      Bedrock model ID of the parser (PARSER_MODEL in .env). A plain anthropic.* ID uses the
      Messages API; an inference profile (us.*, global.*) uses the Converse API.
  CognitoUserPoolId:
    Type: String
    Description: User pool whose ID tokens the parser accepts (output of the auth stack).
  CognitoClientId:
    Type: String
    Description: App client the tokens must be issued to (output of the auth stack).
  CorsOrigins:
    Type: CommaDelimitedList
    Description: >-
      Sites allowed to call the parser from a browser: the frontend's addresses and the local
      dev server. Kept up to date by the infra scripts.
  BudgetEmail:
    Type: String
    Default: ""
    Description: "Where the monthly budget alarm goes. Empty: no budget."
  BudgetLimitUsd:
    Type: Number
    Default: 5
    Description: Monthly AWS cost (the whole account) that triggers the alarm.

Conditions:
  HasBudget: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${ProjectName}/agenda-parser
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs only: no VPC, no database, no S3.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-claude
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The Anthropic Messages API on Bedrock (bedrock-mantle). Any model for now:
              # narrowing the resource is a discussion question of the lab (see the ADR).
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
              # The Converse API (bedrock-runtime), for models served through an inference
              # profile, such as us.anthropic.claude-opus-4-5-... (see PARSER_MODEL in .env).
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # The backend's code with a plain handler, like the report builder. No VpcConfig: it needs
  # no database and reaches Bedrock and Cognito's keys over the internet, with no NAT.
  Parser:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-agenda-parser
      Description: Suggests a structured agenda from pasted text (Claude on Bedrock)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures: [x86_64]
      MemorySize: 512
      # A parse takes 2-8 s; one retry after an invalid answer doubles that.
      Timeout: 30
      Role: !GetAtt ParserRole.Arn
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
        # JSON lines: the fields passed with extra= (model, tokens, cost, ...) become keys.
        LogFormat: JSON
        ApplicationLogLevel: INFO
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Parser.Arn
      AuthType: NONE
      # The URL answers the browser's preflight itself; the handler adds no CORS headers.
      Cors:
        AllowOrigins: !Ref CorsOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  # Public, like the API: anyone may reach it, the handler rejects calls without a valid
  # Cognito token. A public function URL needs both permissions.
  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # The cheapest insurance: an email when the month's actual (or forecast) cost passes the limit.
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
      ResourceTags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ParserUrl:
    Description: The parser's function URL without the trailing slash; the frontend posts to it
    Value: !Sub
      - https://${Domain}
      - Domain: !Select [2, !Split ["/", !GetAtt ParserUrl.FunctionUrl]]
  FunctionName:
    Value: !Ref Parser
  LogGroup:
    Value: !Ref ParserLogGroup
