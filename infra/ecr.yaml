AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - container registry (ECR) for the backend image. Deployed before
  backend.yaml, because the image must exist before ECS can run it. Images are tagged with
  the git commit SHA; tags are immutable, so a tag always means the same build.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}-backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 most recent images (enough to roll back; free tier: 500 MB)",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  RepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  RepositoryName:
    Value: !Ref BackendRepository
